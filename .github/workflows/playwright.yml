name: Playwright Regression

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Playwright path(s). Default: full suite under tests/. Use a file path for a subset."
        required: false
        default: "tests"
      workers:
        description: "Parallel workers (default 1 avoids shared GTP data races across spec files)"
        required: false
        default: "1"
      grep:
        description: "Optional Playwright --grep (regex). Example for 3 tests: gtpLoginTest|loginflowNegativeTest|gtpProjectMenuTest. Leave empty to run all tests in suite."
        required: false
        default: ""
  schedule:
    - cron: "30 2 * * 1-5"

# Avoid stacking many concurrent runs when workflow_dispatch fires repeatedly (e.g. Teams → Power Automate loop).
concurrency:
  group: playwright-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      PW_WORKERS: ${{ github.event.inputs.workers || '1' }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate config from secrets
        shell: bash
        run: |
          mkdir -p config
          cat > config/config.json <<'EOF'
          {
            "url": "${{ secrets.GTP_URL || 'https://dev.gotestpro.com/' }}",
            "username": "${{ secrets.GTP_USERNAME || 'manjesha.v@royalcyber.com' }}",
            "password": "${{ secrets.GTP_PASSWORD || 'admin' }}",
            "projectTitle": "${{ secrets.GTP_PROJECT || 'DemoProject1' }}"
          }
          EOF

      - name: Run Playwright tests in parallel
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE_INPUT: ${{ github.event.inputs.suite || '' }}
          GREP_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grep || '' }}
        run: |
          # Scheduled = full regression; manual = UI default or chosen suite
          if [ "$EVENT_NAME" = "schedule" ]; then
            SUITE="tests"
          elif [ -n "$SUITE_INPUT" ]; then
            SUITE="$SUITE_INPUT"
          else
            SUITE="tests"
          fi
          echo "Running suite: $SUITE"
          if [ -n "$GREP_INPUT" ]; then
            echo "grep: $GREP_INPUT"
            npx playwright test $SUITE --project=chromium --workers="${PW_WORKERS}" --grep "$GREP_INPUT"
          else
            npx playwright test $SUITE --project=chromium --workers="${PW_WORKERS}"
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload raw test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            allure-results/
          retention-days: 14

      - name: Build Teams report payload
        if: ${{ always() && env.TEAMS_WEBHOOK_URL != '' }}
        shell: bash
        env:
          JUNIT_PATH: results/junit-results.xml
          GTP_PROJECT: ${{ secrets.GTP_PROJECT || 'DemoProject1' }}
          REPORT_BROWSER: Chromium
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          TEAMS_PAYLOAD_PATH: results/teams-payload.json
        run: |
          mkdir -p results
          if [ ! -f "$JUNIT_PATH" ]; then
            echo "JUnit not found at $JUNIT_PATH — creating minimal report."
            echo '<testsuites tests="0" failures="1"><testsuite name="playwright" tests="0" failures="1" time="0"></testsuite></testsuites>' > "$JUNIT_PATH"
          fi
          node scripts/build-teams-report.js

      - name: Notify Teams (optional)
        if: ${{ always() && env.TEAMS_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          echo "Posting Teams report..."
          HTTP_STATUS=$(curl -sS -o teams_webhook_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @results/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" || true)
          echo "Teams webhook HTTP status: $HTTP_STATUS"
          echo "Teams webhook response body:"
          cat teams_webhook_response.txt || true
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "Teams webhook returned non-success status. If card does not render, use a Power Automate incoming webhook (Adaptive Card)."
            exit 0
          fi

      - name: Email summary (optional)
        if: ${{ always() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 587 }}
          secure: false
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Playwright run ${{ job.status }} - ${{ github.repository }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM || env.SMTP_USERNAME }}
          body: |
            Playwright run status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Artifacts include Playwright HTML report and test-results.
