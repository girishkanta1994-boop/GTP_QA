trigger:
- main

pool:
  vmImage: windows-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18'
  displayName: 'Install Node.js'
- script: npm ci
  displayName: 'npm ci'
- script: npx playwright install --with-deps
  displayName: 'Install Playwright browsers'
- script: npx playwright test --project=chromium
  displayName: 'Run Playwright tests'
  env:
    CI: 'true'

- task: PublishTestResults@2
  displayName: 'Publish Playwright Test Results'
  inputs:
    searchFolder: 'results'
    testResultsFiles: 'junit-results.xml'
    testResultsFormat: 'JUnit'
    testResultsTitle: 'Playwright Test Results'
    mergeTestResults: false
    failTaskOnFailedTests: true
    testRunTitle: 'My End-To-End Tests'
    publishRunAttachments: true
    testRunSystem: 'Playwright'
  condition: always()
- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright Report'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/playwright-report'
    artifact: 'test-report'
    publishLocation: 'Container'
  condition: always()
